<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A4 Product Sheet</title>

<!-- PDF Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
}

/* Form Page */
.container {
    padding: 20px;
    text-align: center;
}

input {
    padding: 10px;
    margin: 5px;
    width: 90%;
    max-width: 400px;
}

button {
    padding: 10px 15px;
    margin: 10px 5px;
    cursor: pointer;
}

/* A4 Layout */
#a4 {
    width: 210mm;
    height: 297mm;
    margin: auto;
    padding: 8mm;
    background: white;
    box-sizing: border-box;
    overflow: hidden; /* 🔥 FIX */
}

/* Header */
.header img {
    width: 100%;
    height: auto;
    max-height: 120mm; /* prevent large image */
    object-fit: cover;
}

/* Table */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    table-layout: fixed;
}

th, td {
    border: 1px solid black;
    padding: 6px;
    font-size: 12px;
    word-break: break-word;
}

/* Scroll fix for mobile */
#previewPage {
    overflow-x: auto;
}

/* Print */
@media print {
    .container, .actions {
        display: none;
    }

    #a4 {
        width: 210mm;
        height: 297mm;
    }
}
</style>
</head>

<body>

<!-- INPUT -->
<div class="container" id="formPage">
    <h2>Enter Products</h2>

    <div id="products">
        <div>
            <input type="text" placeholder="Product Name">
            <input type="text" placeholder="Price">
        </div>
    </div>

    <button onclick="addProduct()">+ Add Product</button>
    <button onclick="generatePreview()">Submit</button>
</div>

<!-- PREVIEW -->
<div id="previewPage" style="display:none;">
    <div id="a4">

        <!-- HEADER -->
        <div class="header">
            <img src="Untitled design.jpg">
        </div>

        <!-- TABLE -->
        <table id="productTable">
            <tr>
                <th style="width:70%">Product</th>
                <th style="width:30%">Price</th>
            </tr>
        </table>

    </div>

    <div class="actions" style="text-align:center;">
        <button onclick="window.print()">Print</button>
        <button onclick="downloadPDF()">Download PDF</button>
    </div>
</div>

<script>
function addProduct() {
    let div = document.createElement("div");
    div.innerHTML = `
        <input type="text" placeholder="Product Name">
        <input type="text" placeholder="Price">
    `;
    document.getElementById("products").appendChild(div);
}

function generatePreview() {
    let productDivs = document.querySelectorAll("#products div");
    let table = document.getElementById("productTable");

    table.innerHTML = `
        <tr>
            <th style="width:70%">Product</th>
            <th style="width:30%">Price</th>
        </tr>
    `;

    productDivs.forEach(div => {
        let inputs = div.querySelectorAll("input");
        let name = inputs[0].value;
        let price = inputs[1].value;

        if (name && price) {
            let row = table.insertRow();
            row.insertCell(0).innerText = name.substring(0, 40);
            row.insertCell(1).innerText = "₹ " + price;
        }
    });

    document.getElementById("formPage").style.display = "none";
    document.getElementById("previewPage").style.display = "block";
}

/* REAL PDF DOWNLOAD */
function downloadPDF() {
    const element = document.getElementById("a4");

    const opt = {
        margin: 0,
        filename: 'product-list.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 3, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    html2pdf().set(opt).from(element).save();
}
</script>

</body>
</html>
